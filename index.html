    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

  .card{

    width:100%;
    text-align:center;
    background:var(--ink);
    border:1px solid var(--brass);

    padding:40px 30px 34px;

  .avatar{

    justify-content:center;

  .avatar img{width:100%; height:100%; object-fit:contain;}
  h1{

  .below{

    margin-bottom:26px;
  }
  .btn{

    gap:10px;
    width:100%;
    background:var(--brass);
    color:var(--ink);
    font-weight:800;
    font-size:16px;
    padding:16px 20px;
    border-radius:10px;
    text-decoration:none;
    border:1px solid var(--brass);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .btn:hover{background:transparent; color:var(--brass-light);}
  .btn svg{width:20px; height:20px;}
